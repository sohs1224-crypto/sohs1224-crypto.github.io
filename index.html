<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무지의 베일 토론</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--sub:#6b7280;--ac:#4f46e5;--ac2:#e0e7ff;--bd:#e5e7eb;--r1:#f59e0b;--r2:#4f46e5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--card:#202228;--tx:#eceef2;--sub:#9aa1ad;--ac:#818cf8;--ac2:#2a2d4a;--bd:#33363f;--r1:#fbbf24;--r2:#818cf8;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.55;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--sub);font-size:14px}
.badge{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
.veil{background:var(--ac2);border-color:var(--ac)}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600;width:100%;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button:disabled{opacity:.45}
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:6px 0}
textarea{min-height:64px;resize:vertical}
label.opt{display:block;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}
label.opt.on{border-color:var(--ac);background:var(--ac2)}
.rate{display:flex;gap:6px;margin:6px 0 12px}
.rate button{flex:1;padding:10px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.rate button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.bar span.l{width:30px;color:var(--sub)}
.bar i{display:block;height:14px;border-radius:7px}
.row{display:flex;gap:8px}
ul{padding-left:18px;margin:6px 0}
.host{border:1px dashed var(--ac)}
.msg{font-size:14px;margin:8px 0;padding:8px 10px;background:var(--bg);border-radius:8px}
#qr{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<main id="app"><div class="card">불러오는 중…</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SB="https://omtwhlhllfwkhhsbfcog.supabase.co",KEY="sb_publishable_uRa6pwO_vj2jHYHOzWEKcQ_--9LGiII";
const TOPIC="우리 반 청소 당번을 어떤 규칙으로 정할까?";
const OPTIONS=["번호순으로 돌아가며 똑같이","시간 여유가 많은 사람이 더 많이","모두 매일 조금씩 나눠서","매주 제비뽑기로 정하기"];
const ROLES=["학원 때문에 방과 후 시간이 거의 없는 학생","방과 후 시간이 넉넉한 학생","몸이 약해서 무거운 청소가 힘든 학생","청소를 좋아하고 잘하는 학생"];
const PH=["대기실","1차 토론","2차 토론 (무지의 베일)","결과"];
const $=document.getElementById("app");
const HOST=new URLSearchParams(location.search).get("host")||"";
let S={phase:0,players:[]},mine=null,draft={},err="",lastKey="",showQR=false,resetArm=false,loaded=false;
try{mine=JSON.parse(localStorage.getItem("veil_me")||"null")}catch(e){}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

async function rpc(fn,body){
  const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  if(!r.ok){let m="";try{m=(await r.json()).message}catch(e){}throw new Error(m||("오류 "+r.status))}
  const t=await r.text();return t?JSON.parse(t):null;
}
async function poll(){
  try{S=await rpc("get_state");loaded=true;if(err==="연결이 불안정해요")err=""}catch(e){if(!loaded)err="연결이 불안정해요"}
  if(mine&&loaded&&!S.players.find(p=>p.id===mine.id)){mine=null;localStorage.removeItem("veil_me")}
  render();
}
const me=()=>mine&&S.players.find(p=>p.id===mine.id);
function msg(m){err=m;lastKey="";render()}

async function join(){
  const nick=(draft.nick||"").trim();if(!nick){return msg("닉네임을 입력하세요")}
  try{const r=await rpc("join_player",{p_nick:nick});mine={id:r.id,token:r.token};localStorage.setItem("veil_me",JSON.stringify(mine));err="";await poll()}
  catch(e){msg("참여 실패: "+e.message)}
}
async function setPhase(p){
  try{await rpc("set_phase",{p_code:HOST,p_phase:p});err="";await poll()}catch(e){msg(e.message==="forbidden"?"진행자 코드가 틀렸어요":"단계 변경 실패")}
}
async function resetAll(){
  if(!resetArm){resetArm=true;lastKey="";render();setTimeout(()=>{resetArm=false;lastKey="";render()},5000);return}
  resetArm=false;
  try{await rpc("reset_all",{p_code:HOST});draft={};err="";await poll()}catch(e){msg("초기화 실패")}
}
function toggleQR(){showQR=!showQR;lastKey="";render()}
function rate(k,v){draft[k]=v;document.querySelectorAll('[data-k="'+k+'"] button').forEach(b=>b.classList.toggle("on",+b.dataset.v===v))}
function pick(i){draft.v=i;document.querySelectorAll("label.opt").forEach((l,j)=>l.classList.toggle("on",j===i))}
async function submit(r){
  if(draft.v==null||!draft.c||!draft.s){return msg("선택지, 갈등 정도, 만족도를 모두 골라 주세요")}
  try{await rpc("submit_round",{p_token:mine.token,p_round:r,p_v:draft.v,p_reason:(draft.reason||"").trim(),p_c:draft.c,p_s:draft.s});draft={};err="";await poll()}
  catch(e){msg("제출 실패: "+e.message)}
}
function rateRow(k,label){return `<div>${label}</div><div class="rate" data-k="${k}">${[1,2,3,4,5].map(n=>`<button onclick="rate('${k}',${n})" data-v="${n}" class="${draft[k]===n?"on":""}">${n}</button>`).join("")}</div>`}
function form(r,m){
  const veil=r===2;
  return `<div class="card ${veil?"veil":""}"><span class="badge">${PH[r]}</span>
  <h2 style="margin-top:8px">${esc(TOPIC)}</h2>
  ${veil?`<p class="sub">🔒 당신의 역할은 <b>가려져 있어요</b>. 아래 4가지 중 어떤 사람이 될지 모른 채, 누가 되어도 괜찮은 규칙을 고르세요.</p><ul class="sub">${ROLES.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`
  :`<p class="sub">당신의 역할</p><p><b>${esc(ROLES[m.role])}</b></p><p class="sub">이 입장에서 가장 유리한 규칙을 고르세요.</p>`}
  ${OPTIONS.map((o,i)=>`<label class="opt ${draft.v===i?"on":""}" onclick="pick(${i})">${esc(o)}</label>`).join("")}
  <textarea maxlength="200" placeholder="그렇게 고른 이유 (한 줄)" oninput="draft.reason=this.value">${esc(draft.reason||"")}</textarea>
  ${rateRow("c","지금 친구들과 갈등이 느껴지는 정도 (1 없음 ~ 5 매우 큼)")}
  ${rateRow("s","내가 고른 규칙에 대한 만족도 (1 낮음 ~ 5 높음)")}
  ${err?`<div class="msg">${esc(err)}</div>`:""}
  <button onclick="submit(${r})">제출하기</button></div>`;
}
function stats(r){
  const L=S.players.filter(p=>p["v"+r]!=null);
  const cnt=OPTIONS.map((_,i)=>L.filter(p=>p["v"+r]===i).length);
  const top=Math.max(0,...cnt);
  return{n:L.length,c:avg(L.map(p=>p["c"+r])),s:avg(L.map(p=>p["s"+r])),cons:L.length?top/L.length:0,topI:cnt.indexOf(top),cnt};
}
function cmpBar(label,a,b,max,pct){
  const w=v=>Math.round(v/max*100);
  return `<div style="margin:10px 0"><b>${label}</b>
  <div class="bar"><span class="l">1차</span><i style="width:${w(a)}%;background:var(--r1)"></i>${a.toFixed(pct?0:1)}${pct?"%":""}</div>
  <div class="bar"><span class="l">2차</span><i style="width:${w(b)}%;background:var(--r2)"></i>${b.toFixed(pct?0:1)}${pct?"%":""}</div></div>`;
}
function summary(a,b){
  return `[무지의 베일 토론 결과]\n주제: ${TOPIC}\n참여자 ${S.players.length}명 (응답 1차 ${a.n}명, 2차 ${b.n}명)\n\n항목 | 1차(자기 입장) | 2차(무지의 베일)\n갈등 정도 평균(1~5) | ${a.c.toFixed(2)} | ${b.c.toFixed(2)}\n만족도 평균(1~5) | ${a.s.toFixed(2)} | ${b.s.toFixed(2)}\n최다 득표 비율 | ${(a.cons*100).toFixed(0)}% | ${(b.cons*100).toFixed(0)}%\n1차 최다 선택: ${a.n?OPTIONS[a.topI]:"-"}\n2차 최다 선택: ${b.n?OPTIONS[b.topI]:"-"}\n\n1차 득표: ${OPTIONS.map((o,i)=>o+" "+a.cnt[i]).join(" / ")}\n2차 득표: ${OPTIONS.map((o,i)=>o+" "+b.cnt[i]).join(" / ")}`;
}
async function copySum(){
  try{await navigator.clipboard.writeText(window._sum);msg("복사했어요")}catch(e){draft.show=true;msg("복사 실패: 아래 텍스트를 직접 선택해 복사하세요")}
}
function result(){
  const a=stats(1),b=stats(2),t=summary(a,b);window._sum=t;
  const ops=r=>S.players.filter(p=>p["r"+r]).map(p=>`<li><b>${esc(p.nick)}</b> (${esc(ROLES[p.role])}) → ${esc(OPTIONS[p["v"+r]])}<br><span class="sub">${esc(p["r"+r])}</span></li>`).join("");
  return `<div class="card"><span class="badge">결과</span><h2 style="margin-top:8px">1차 vs 2차 비교</h2>
  ${cmpBar("갈등 정도 (평균)",a.c,b.c,5)}${cmpBar("만족도 (평균)",a.s,b.s,5)}${cmpBar("합의도 (최다 득표 비율)",a.cons*100,b.cons*100,100,true)}
  <p class="sub">🟧 1차(자기 입장) 🟦 2차(무지의 베일)</p></div>
  <div class="card"><h2>의견 모아보기</h2><b>1차</b><ul>${ops(1)||"<li class='sub'>없음</li>"}</ul><b>2차</b><ul>${ops(2)||"<li class='sub'>없음</li>"}</ul></div>
  <div class="card"><button onclick="copySum()">보고서용 요약 복사</button>${err?`<div class="msg">${esc(err)}</div>`:""}${draft.show?`<textarea readonly style="min-height:200px">${esc(t)}</textarea>`:""}</div>`;
}
function hostPanel(){
  const p=S.phase,k=p===1||p===2?p:0,n=S.players.length;
  const done=k?S.players.filter(x=>x["v"+k]!=null).length:0;
  return `<div class="card host"><b>진행자 화면</b><p class="sub" id="hc">현재: ${PH[p]} · 참여 ${n}명${k?` · 제출 ${done}명`:""}</p>
  <div class="row"><button class="ghost" ${p<=0?"disabled":""} onclick="setPhase(${p-1})">이전 단계</button><button ${p>=3||(p===0&&!n)?"disabled":""} onclick="setPhase(${p+1})">다음 단계</button></div>
  <button class="ghost" style="margin-top:10px" onclick="toggleQR()">${showQR?"QR 코드 닫기":"QR 코드 보기"}</button>
  ${showQR?`<div id="qr"></div><p class="sub" style="word-break:break-all">${esc(location.origin+location.pathname)}</p>`:""}
  <button class="ghost" style="margin-top:10px" onclick="resetAll()">${resetArm?"정말 모두 지울까요? 한 번 더 누르세요":"처음부터 다시 시작 (초기화)"}</button></div>`;
}
function render(){
  if(!loaded&&!err)return;
  const p=S.phase,m=me();
  const key=[p,!!m,m&&m.v1!=null,m&&m.v2!=null,err,draft.show,showQR,resetArm,p===0||p===3?JSON.stringify(S.players):""].join("|");
  if(key===lastKey){const hc=document.getElementById("hc");if(hc&&HOST){const t=document.createElement("div");t.innerHTML=hostPanel();hc.textContent=t.querySelector("#hc").textContent}return}
  lastKey=key;
  let h=`<h1>무지의 베일 토론</h1><p class="sub">${PH[p]}${m?" · "+esc(m.nick):""}</p>`;
  if(HOST)h+=hostPanel();
  if(!m){
    h+=`<div class="card"><h2>닉네임을 입력하고 참여하세요</h2><p class="sub">${esc(TOPIC)}</p><input type="text" maxlength="12" placeholder="닉네임" value="${esc(draft.nick||"")}" oninput="draft.nick=this.value">${err?`<div class="msg">${esc(err)}</div>`:""}<button onclick="join()">참여하기</button></div>`;
  }else if(p===0){
    h+=`<div class="card"><h2>${esc(TOPIC)}</h2><p class="sub">진행자가 시작할 때까지 기다려 주세요.</p><b>참여자 (${S.players.length}명)</b><ul>${S.players.map(x=>`<li>${esc(x.nick)}</li>`).join("")}</ul></div>`;
  }else if(p===1||p===2){
    h+=m["v"+p]!=null?`<div class="card"><h2>제출 완료 ✅</h2><p class="sub">진행자가 다음 단계로 넘길 때까지 기다려 주세요. 토론하며 이야기를 나눠 보세요!</p></div>`:form(p,m);
  }else h+=result();
  if(err&&m&&p!==1&&p!==2&&p!==3)h+=`<div class="msg">${esc(err)}</div>`;
  $.innerHTML=h;
  if(showQR&&HOST&&window.QRCode){const q=document.getElementById("qr");if(q)new QRCode(q,{text:location.origin+location.pathname,width:200,height:200})}
  if(err&&err!=="연결이 불안정해요"&&p!==1&&p!==2)setTimeout(()=>{err="";lastKey="";render()},3500);
}
poll();setInterval(poll,2000);
</script>
</body>
</html>
